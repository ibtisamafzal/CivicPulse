steps:
  # Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/civicpulse-489613/civicpulse/backend:latest",
        ".",
      ]

  # Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "--all-tags",
        "us-central1-docker.pkg.dev/civicpulse-489613/civicpulse/backend",
      ]

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "civicpulse-backend"
      - "--image"
      - "us-central1-docker.pkg.dev/civicpulse-489613/civicpulse/backend:latest"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--port"
      - "8080"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "3"
      - "--allow-unauthenticated"
      - "--set-env-vars"
      - "NODE_ENV=production,TZ=America/Chicago,CIVICPULSE_TZ=America/Chicago"
      - "--set-secrets"
      - "PERPLEXITY_API_KEY=PERPLEXITY_API_KEY:latest,ELEVENLABS_API_KEY=ELEVENLABS_API_KEY:latest,ELEVENLABS_AGENT_ID=ELEVENLABS_AGENT_ID:latest,ELEVENLABS_VOICE_ID=ELEVENLABS_VOICE_ID:latest,ELEVENLABS_TTS_MODEL_ID=ELEVENLABS_TTS_MODEL_ID:latest,FIRECRAWL_API_KEY=FIRECRAWL_API_KEY:latest,GCS_BUCKET_NAME=GCS_BUCKET_NAME:latest,PIPELINE_SECRET=PIPELINE_SECRET:latest"

images:
  - "us-central1-docker.pkg.dev/civicpulse-489613/civicpulse/backend"

options:
  logging: CLOUD_LOGGING_ONLY
